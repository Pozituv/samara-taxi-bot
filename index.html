<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi_Samara</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--tg-theme-secondary-bg-color, #212d3b);
            padding: 20px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 20px;
        }

        .role-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #131a22;
            padding: 4px;
            border-radius: 12px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #879baf;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .role-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: #fff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #879baf;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2f3d4c;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background: #18222d;
            color: inherit;
        }

        input:focus, select:focus {
            border-color: var(--tg-theme-button-color, #2481cc);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .camera-btn-wrap {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            background-color: #2f3d4c;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .camera-btn-wrap input[type="file"] {
            position: absolute;
            top: 0;
            right: 0;
            min-width: 100%;
            min-height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-thumb {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Taxi_Samara</h2>

        <!-- Переключатель роли -->
        <div class="role-selector">
            <button class="role-btn active" id="passengerRoleBtn" onclick="switchRole('passenger')">Пассажир</button>
            <button class="role-btn" id="driverRoleBtn" onclick="switchRole('driver')">Водитель</button>
        </div>

        <!-- ИНТЕРФЕЙС ПАССАЖИРА -->
        <div id="passengerView">
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" id="pPhone" value="+7 ">
            </div>
            <div class="form-group">
                <label>Откуда забрать</label>
                <input type="text" id="pFrom" placeholder="Улица, дом">
            </div>
            <div class="form-group">
                <label>Куда едем</label>
                <input type="text" id="pTo" placeholder="Адрес назначения">
            </div>
            <button class="btn" id="orderBtn">Заказать такси</button>
        </div>

        <!-- ИНТЕРФЕЙС ВОДИТЕЛЯ -->
        <div id="driverView" class="hidden">
            <h3 style="font-size: 16px; margin-top: 0; margin-bottom: 12px; color: #4ea4f5; text-align: center;">Регистрация водителя</h3>
            
            <div class="form-group">
                <label>ФИО водителя</label>
                <input type="text" id="dName" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label>Номер телефона (для переводов)</label>
                <input type="tel" id="dPhone" value="+7 ">
            </div>

            <div class="form-group">
                <label>Марка и модель автомобиля</label>
                <input type="text" id="dCar" placeholder="Hyundai Creta / Kia Rio">
            </div>

            <div class="form-group">
                <label>Государственный номер</label>
                <input type="text" id="dNumber" placeholder="А123ВС63">
            </div>

            <div class="form-group">
                <label>Национальность / Гражданство</label>
                <select id="dNat">
                    <option value="Русский">Русский</option>
                    <option value="Татарин">Татарин</option>
                    <option value="Башкир">Башкир</option>
                    <option value="Армянин">Армянин</option>
                    <option value="Азербайджанец">Азербайджанец</option>
                    <option value="Узбек">Узбек</option>
                    <option value="Таджик">Таджик</option>
                    <option value="Казах">Казах</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <div class="form-group">
                <label>Права — Лицевая сторона:</label>
                <div class="camera-btn-wrap">
                    📷 Нажмите, чтобы открыть камеру
                    <input type="file" accept="image/*" capture="environment" id="driverPhoto" onchange="showPhoto(event)">
                </div>
                <div style="text-align: center;">
                    <img id="photoPreview" class="preview-thumb" alt="Превью">
                </div>
                <div id="photoStatus" style="font-size: 12px; color: #879baf; text-align: center; margin-top: 4px;">Фото не сделано</div>
            </div>

            <button class="btn" id="saveDriverBtn">Сохранить анкету</button>
        </div>

    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function switchRole(role) {
            let pView = document.getElementById('passengerView');
            let dView = document.getElementById('driverView');
            let pBtn = document.getElementById('passengerRoleBtn');
            let dBtn = document.getElementById('driverRoleBtn');

            if (role === 'passenger') {
                pView.classList.remove('hidden');
                dView.classList.add('hidden');
                pBtn.classList.add('active');
                dBtn.classList.remove('active');
            } else {
                pView.classList.add('hidden');
                dView.classList.remove('hidden');
                pBtn.classList.remove('active');
                dBtn.classList.add('active');
            }
        }

        function showPhoto(event) {
            let file = event.target.files[0];
            let preview = document.getElementById('photoPreview');
            let status = document.getElementById('photoStatus');
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'inline-block';
                    status.textContent = 'Фото успешно прикреплено!';
                    status.style.color = '#4ea4f5';
                }
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('orderBtn').addEventListener('click', function() {
            let phone = document.getElementById('pPhone').value;
            let from = document.getElementById('pFrom').value;
            let to = document.getElementById('pTo').value;

            if (!phone || phone.length < 5 || !from || !to) {
                alert('Заполните все поля!');
                return;
            }

            tg.sendData(JSON.stringify({
                action: 'order_taxi',
                phone: phone,
                from: from,
                to: to
            }));
        });

        document.getElementById('saveDriverBtn').addEventListener('click', function() {
            let name = document.getElementById('dName').value;
            let phone = document.getElementById('dPhone').value;
            let car = document.getElementById('dCar').value;
            let number = document.getElementById('dNumber').value;
            let nationality = document.getElementById('dNat').value;
            let photoInput = document.getElementById('driverPhoto');

            if (!name || !car || !number || phone.length < 5) {
                alert('Пожалуйста, заполните все данные водителя!');
                return;
            }

            let hasPhoto = photoInput.files && photoInput.files.length > 0;

            let btn = document.getElementById('saveDriverBtn');
            btn.textContent = 'Анкета отправлена! ✅';
            btn.style.backgroundColor = '#28a745';

            tg.sendData(JSON.stringify({
                action: 'register_driver',
                name: name,
                phone: phone,
                car: car,
                number: number,
                nationality: nationality,
                has_photo: hasPhoto
            }));
        });
    </script>
</body>
</html>
