<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Такси Самара</title>
    <!-- Официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            margin: 0;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        h2 {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .field-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h2>Заказ такси</h2>

    <div class="field-group">
        <label for="from">Откуда:</label>
        <input type="text" id="from" placeholder="Укажите адрес подачи">
    </div>

    <div class="field-group">
        <label for="to">Куда:</label>
        <input type="text" id="to" placeholder="Куда едем?">
    </div>

    <button id="orderBtn">Заказать такси</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на весь экран

        document.getElementById('orderBtn').onclick = function() {
            let from = document.getElementById('from').value;
            let to = document.getElementById('to').value;

            if (!from || !to) {
                alert('Пожалуйста, заполните точки А и Б');
                return;
            }

            // Отправка данных назад боту
            let data = JSON.stringify({ from: from, to: to });
            tg.sendData(data);
        };
    </script>
</body>
</html>
