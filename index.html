<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi_Samara - Полная версия</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--tg-theme-secondary-bg-color, #212d3b);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Переключатель роли */
        .role-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: #131a22;
            padding: 4px;
            border-radius: 12px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #879baf;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #879baf;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2f3d4c;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background: #18222d;
            color: #ffffff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--tg-theme-button-color, #2481cc);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }

        /* Карточка информации о назначенном водителе для пассажира */
        .driver-card {
            background: #18222d;
            border: 1px solid #2f3d4c;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }

        .driver-card-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .driver-info-row {
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            color: #b0c2d2;
        }

        .driver-info-value {
            font-weight: 600;
            color: #4ea4f5;
        }

        /* Блок стикеров / быстрой обратной связи */
        .feedback-section {
            margin-top: 24px;
            border-top: 1px solid #2f3d4c;
            padding-top: 16px;
            text-align: center;
        }

        .feedback-title {
            font-size: 13px;
            color: #879baf;
            margin-bottom: 12px;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .sticker-btn {
            background: #18222d;
            border: 1px solid #2f3d4c;
            border-radius: 12px;
            padding: 10px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s, background 0.2s;
        }

        .sticker-btn:active {
            transform: scale(0.95);
            background: #2f3d4c;
        }

        .sticker-emoji {
            font-size: 20px;
        }

        .sticker-text {
            font-size: 11px;
            font-weight: 500;
            color: #ffffff;
        }

        .info-note {
            font-size: 12px;
            color: #879baf;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚖 Taxi_Samara</h2>

        <!-- Переключатель роли: Пассажир / Водитель -->
        <div class="role-selector">
            <button class="role-btn active" id="passengerRoleBtn" onclick="switchRole('passenger')">Пассажир</button>
            <button class="role-btn" id="driverRoleBtn" onclick="switchRole('driver')">Водитель</button>
        </div>

        <!-- ================= ИНТЕРФЕЙС ПАССАЖИРА ================= -->
        <div id="passengerView">
            <div class="form-group">
                <label for="pPhone">Номер телефона</label>
                <input type="tel" id="pPhone" value="+7 " placeholder="+7 (___) ___-__-__">
            </div>

            <div class="form-group">
                <label for="pFrom">Откуда забрать</label>
                <input type="text" id="pFrom" placeholder="Улица, дом, ориентир">
            </div>

            <div class="form-group">
                <label for="pTo">Куда едем</label>
                <input type="text" id="pTo" placeholder="Адрес назначения в Самаре">
            </div>

            <div class="form-group">
                <label for="pComment">Пожелания к поездке (необязательно)</label>
                <input type="text" id="pComment" placeholder="Детское кресло, багаж, тишина">
            </div>

            <button class="btn" id="orderBtn">Заказать такси</button>

            <!-- Карточка водителя для пассажира -->
            <div class="driver-card" id="driverCard">
                <div class="driver-card-title">👨‍✈️ Информация о водителе:</div>
                <div class="driver-info-row"><span>Статус:</span> <span class="driver-info-value" id="dStatus">Поиск водителя...</span></div>
                <div class="driver-info-row"><span>Имя:</span> <span class="driver-info-value" id="dViewName">—</span></div>
                <div class="driver-info-row"><span>Автомобиль:</span> <span class="driver-info-value" id="dViewCar">—</span></div>
                <div class="driver-info-row"><span>Госномер:</span> <span class="driver-info-value" id="dViewNumber">—</span></div>
                <div class="driver-info-row"><span>Национальность:</span> <span class="driver-info-value" id="dViewNat">—</span></div>
            </div>

            <!-- Блок стикеров обратной связи -->
            <div class="feedback-section">
                <div class="feedback-title">Оцените поездку или отправьте пожелание:</div>
                <div class="sticker-grid">
                    <button class="sticker-btn" onclick="sendFeedback('⭐️ Отличная поездка!')">
                        <span class="sticker-emoji">⭐</span>
                        <span class="sticker-text">Отлично</span>
                    </button>
                    <button class="sticker-btn" onclick="sendFeedback('💬 Чего не хватает в приложении...')">
                        <span class="sticker-emoji">💡</span>
                        <span class="sticker-text">Идея / Улучшить</span>
                    </button>
                    <button class="sticker-btn" onclick="sendFeedback('⚠️ Сообщить о проблеме')">
                        <span class="sticker-emoji">⚠️</span>
                        <span class="sticker-text">Проблема</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= ИНТЕРФЕЙС ВОДИТЕЛЯ ================= -->
        <div id="driverView" class="hidden">
            <h3 style="font-size: 16px; margin-top: 0; margin-bottom: 15px; color: #4ea4f5; text-align: center;">Регистрация водителя</h3>
            
            <div class="form-group">
                <label for="dName">ФИО водителя</label>
                <input type="text" id="dName" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label for="dPhone">Номер телефона (для переводов)</label>
                <input type="tel" id="dPhone" value="+7 " placeholder="+7 (___) ___-__-__">
            </div>

            <div class="form-group">
                <label for="dCar">Марка и модель автомобиля</label>
                <input type="text" id="dCar" placeholder="Lada Vesta / Kia Rio">
            </div>

            <div class="form-group">
                <label for="dNumber">Государственный номер</label>
                <input type="text" id="dNumber" placeholder="А123ВС63">
            </div>

            <!-- Выбор национальности/гражданства -->
            <div class="form-group">
                <label for="dNat">Национальность / Гражданство</label>
                <select id="dNat">
                    <option value="Русский">Русский</option>
                    <option value="Татарин">Татарин</option>
                    <option value="Башкир">Башкир</option>
                    <option value="Армянин">Армянин</option>
                    <option value="Азербайджанец">Азербайджанец</option>
                    <option value="Узбек">Узбек</option>
                    <option value="Таджик">Таджик</option>
                    <option value="Казах">Казах</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <button class="btn" id="saveDriverBtn">Сохранить анкету и выйти на линию</button>
            <div class="info-note">Данные поступают диспетчеру для активации профиля и выдачи заказов в Самаре.</div>
        </div>

    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Переключение между ролями Пассажир / Водитель
        function switchRole(role) {
            let pView = document.getElementById('passengerView');
            let dView = document.getElementById('driverView');
            let pBtn = document.getElementById('passengerRoleBtn');
            let dBtn = document.getElementById('driverRoleBtn');

            if (role === 'passenger') {
                pView.classList.remove('hidden');
                dView.classList.add('hidden');
                pBtn.classList.add('active');
                dBtn.classList.remove('active');
            } else {
                pView.classList.add('hidden');
                dView.classList.remove('hidden');
                pBtn.classList.remove('active');
                dBtn.classList.add('active');
            }
        }

        // Обработка заказа такси пассажиром
        document.getElementById('orderBtn').addEventListener('click', function() {
            let phone = document.getElementById('pPhone').value;
            let from = document.getElementById('pFrom').value;
            let to = document.getElementById('pTo').value;
            let comment = document.getElementById('pComment').value;

            if (!phone || phone.length < 5) {
                alert('Пожалуйста, укажите номер телефона');
                return;
            }
            if (!from || !to) {
                alert('Пожалуйста, заполните адреса откуда и куда едем');
                return;
            }

            let orderData = {
                action: 'order_taxi',
                phone: phone,
                from: from,
                to: to,
                comment: comment
            };

            tg.sendData(JSON.stringify(orderData));
        });

        // Сохранение анкеты водителя
        document.getElementById('saveDriverBtn').addEventListener('click', function() {
            let name = document.getElementById('dName').value;
            let phone = document.getElementById('dPhone').value;
            let car = document.getElementById('dCar').value;
            let number = document.getElementById('dNumber').value;
            let nationality = document.getElementById('dNat').value;

            if (!name || !car || !number) {
                alert('Пожалуйста, заполните имя, модель и госномер автомобиля');
                return;
            }
            if (!phone || phone.length < 5) {
                alert('Пожалуйста, укажите контактный телефон водителя');
                return;
            }

            let driverData = {
                action: 'register_driver',
                name: name,
                phone: phone,
                car: car,
                number: number,
                nationality: nationality
            };

            tg.sendData(JSON.stringify(driverData));
        });

        // Функция отправки обратной связи через интерактивные стикеры-кнопки
        function sendFeedback(type) {
            let feedbackData = {
                action: 'feedback',
                text: type
            };
            tg.sendData(JSON.stringify(feedbackData));
        }
    </script>
</body>
</html>
